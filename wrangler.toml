name = "procurement-crm-worker"
main = "src/worker/index.js"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "procurement-crm-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "procurement-crm-media"

[vars]
MEDIA_PUBLIC_URL = ""
