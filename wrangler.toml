name = "procurement-crm-worker"
main = "src/worker/index.js"
compatibility_date = "2026-06-10"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "procurement-crm-db"
database_id = "049be798-4464-48d2-899b-c23840a458a8"

[[kv_namespaces]]
binding = "KV"
id = "4e8198ec805841ee922034753906de41"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "procurement-crm-media"

[vars]
# R2 media bucket must remain private. Do not add a public URL var here.
# All file access goes through /api/media (Vercel JWT gateway → Worker → private R2 binding).
# Never enable the r2.dev public subdomain or attach a custom domain on this bucket.
# Never store a populated public_url in D1 media_files for internal procurement files.

[ai]
binding = "AI"

[triggers]
# */4 * * * *  — dashboard warmup every 4 min (keeps KV cache warm within 300s TTL)
# 0 2 * * *    — daily scan at 02:00 UTC (09:00 VN) for expired quotes, deadlines, orphan media
crons = ["*/4 * * * *", "0 2 * * *"]
